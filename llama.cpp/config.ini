warmup = off

# API
host = 0.0.0.0
port = 8081
api-key = llama.cpp/api
parallel = 1
models-max = 1
sleep-idle-seconds = 2700

# Host-specific throughput tuning
load-mode = mlock
fit-target = 768
batch-size = 2048
ubatch-size = 2048
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 4096

# Speculative Decoding
spec-type = ngram-mod
spec-draft-p-min = 0.75
spec-draft-n-max = 2
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 8
spec-ngram-mod-n-max = 16
